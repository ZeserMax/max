<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><title>🖼️ 在线图片 OCR（云端）</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
        margin:2rem;background:#fafafa;color:#333;}
  .box{max-width:600px;margin:auto;background:#fff;padding:2rem;border-radius:8px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);}
  h1{margin-top:0;font-size:1.6rem;text-align:center;}
  input[type=file]{display:block;margin:1rem 0;}
  button{padding:.5rem 1rem;font-size:1rem;background:#0066cc;color:#fff;
         border:none;border-radius:4px;cursor:pointer;}
  button:disabled{background:#999;cursor:not-allowed;}
  #status{margin-top:.5rem;color:#555;}
  pre{background:#f6f8fa;padding:1rem;border-radius:4px;white-space:pre-wrap;
       word-break:break-all;margin-top:1rem;}
  #preview{max-width:100%;margin-top:1rem;border:1px solid #ddd;}
</style>
</head>
<body>
<div class="box">
  <h1>📄 在线图片 OCR（云端）</h1>
  <p>选择图片 → 自动上传至云端 → 返回文字结果。</p>

  <input type="file" id="fileInput" accept="image/*">
  <button id="runBtn" disabled>🚀 开始识别</button>

  <img id="preview" src="" alt="图片预览（自动）" hidden>

  <div id="status"></div>
  <pre id="result"></pre>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const runBtn    = document.getElementById('runBtn');
const preview   = document.getElementById('preview');
const status    = document.getElementById('status');
const result    = document.getElementById('result');

let selectedFile = null;

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) { runBtn.disabled = true; preview.hidden = true; return; }
  selectedFile = file;
  const url = URL.createObjectURL(file);
  preview.src = url;
  preview.hidden = false;
  runBtn.disabled = false;
  status.textContent = '';
  result.textContent = '';
});

runBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  runBtn.disabled = true;
  status.textContent = '⏳ 正在上传图片…';

  const form = new FormData();
  form.append('file', selectedFile);

  try {
    const resp = await fetch('/api/ocr', {method:'POST',body:form});
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();   // { text: "…" }
    result.textContent = data.text || '(未检测到文字)';
    status.textContent = data.text ? '✅ OCR 完成' : '⚠️ OCR 完成，但未检测到文字';
  } catch (e) {
    console.error(e);
    status.textContent = `❌ 请求失败: ${e.message}`;
    result.textContent = '';
  } finally {
    runBtn.disabled = false;
  }
});
</script>
</body>
</html>
