<script>
const fileInput = document.getElementById('fileInput');
const runBtn    = document.getElementById('runBtn');
const preview   = document.getElementById('preview');
const status    = document.getElementById('status');
const result    = document.getElementById('result');

let selectedFile = null;

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) {
    runBtn.disabled = true;
    preview.hidden = true;
    return;
  }
  // ---- size guard (1 MB) ----
  if (file.size > 1 * 1024 * 1024) {
    status.textContent = '⚠️ 图片太大（>1 MB），请压缩后重试';
    runBtn.disabled = true;
    preview.hidden = true;
    selectedFile = null;
    return;
  }
  // ---- normal flow ----
  selectedFile = file;
  const url = URL.createObjectURL(file);
  preview.src = url;
  preview.hidden = false;
  runBtn.disabled = false;
  status.textContent = '';
  result.textContent = '';
});

runBtn.addEventListener('click', async () => {
  if (!selectedFile) return;
  runBtn.disabled = true;
  status.textContent = '⏳ 正在上传图片…';

  const form = new FormData();
  form.append('file', selectedFile);

  try {
    const resp = await fetch('/api/ocr', {method:'POST', body:form});

    const data = await resp.json();

    // 当后端返回 error 字段时直接显示细节
    if (!resp.ok) {
      status.textContent = `⚠️ OCR 错误: ${data.error || '未知错误'}`;
      result.textContent = data.details ? `细节: ${JSON.stringify(data.details)}` : '';
      return;
    }

    result.textContent = data.text || '(未检测到文字)';
    status.textContent = data.text ? '✅ OCR 完成' : '⚠️ OCR 完成，但未检测到文字';
  } catch (e) {
    console.error(e);
    status.textContent = `❌ 请求失败: ${e.message}`;
    result.textContent = '';
  } finally {
    runBtn.disabled = false;
  }
});
</script>
